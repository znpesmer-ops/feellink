name: Deploy Backend to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-vercel.yml'
  workflow_dispatch:

jobs:
  trigger-backend-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel feellink-backend deploy
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_BACKEND }}" ]; then
            echo "::warning:: VERCEL_DEPLOY_HOOK_BACKEND secret eklenmemiş."
            exit 0
          fi
          response=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_BACKEND }}")
          http_code=$(echo "$response" | tail -n1)
          echo "Response ($http_code)"
