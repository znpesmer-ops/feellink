<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Feellink QR Etiketi</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: "Helvetica", "Arial", sans-serif;
  }

  .page {
    width: 210mm;
    height: 297mm;
    padding: 25mm;
    box-sizing: border-box;
  }

  /* Gradient çizgi */
  .line {
    height: 5px;
    background: linear-gradient(90deg, #ff6464, #ffa14a, #79b5ff);
    margin-bottom: 20px;
    border-radius: 2px;
  }

  /* Eser bilgileri */
  .title {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 15px;
    color: #000;
    line-height: 1.2;
  }

  .artist {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #000;
    line-height: 1.2;
  }

  .code {
    font-size: 22px;
    color: #333;
    margin-bottom: 40px;
    line-height: 1.2;
  }

  /* QR + text alanı */
  .content {
    display: flex;
    align-items: flex-start;
    gap: 40px;
    margin-top: 20px;
  }

  .qr-box {
    width: 180px;
    height: 180px;
    border: 3px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: #fff;
  }

  .qr-img {
    width: 170px;
    height: 170px;
    display: block;
  }

  .right {
    flex: 1;
  }

  .big-title {
    font-size: 30px;
    font-weight: 600;
    margin-bottom: 25px;
    color: #000;
    line-height: 1.3;
  }

  /* Açıklama kutusu */
  .info-box {
    border: 3px solid #ffa14a;
    padding: 20px 25px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    background: #fff;
  }

  .info-text {
    font-size: 20px;
    line-height: 1.45;
    max-width: 420px;
    color: #000;
    flex: 1;
  }

  .hand-icon {
    width: 120px;
    height: auto;
    flex-shrink: 0;
  }

  @media print {
    .page {
      page-break-after: avoid;
    }
  }
</style>

</head>
<body>

<div class="page">

  <!-- ESER BAŞLIK ALANI -->
  <div class="title">{{TITLE}}</div>
  <div class="artist">{{ARTIST}}</div>
  <div class="code">{{CODE}}</div>

  <!-- GRADIENT ÇİZGİ -->
  <div class="line"></div>

  <!-- QR ve Metin -->
  <div class="content">

    <div class="qr-box">
      <img src="{{QR_DATA_URL}}" class="qr-img" alt="QR Code" />
    </div>

    <div class="right">
      <div class="big-title">Feellink ile sanat daha anlamlı!</div>

      <div class="info-box">
        <div class="info-text">
          Bu eser hakkında ne düşünüyorsun?<br />
          Duygularını, fikirlerini bizimle paylaş!<br />
          QR kodu tarat, yorumunu bırak ve diğer sanatseverlerin görüşlerini keşfet.
        </div>
        <img src="{{HAND_ICON}}" class="hand-icon" alt="QR Tarama" />
      </div>
    </div>

  </div>

</div>

</body>
</html>
